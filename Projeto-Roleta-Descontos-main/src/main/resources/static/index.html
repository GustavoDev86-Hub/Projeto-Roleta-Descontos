<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta de descontos Avenida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="logo.png" alt="Logo da loja">
    </header>

    <main class="container">
        <section class="section-form">
            <h1>Gire e garanta seu desconto</h1>
            <form id="form-lead">

                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>

                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Aceito os termos e condições</label>
                </div>

                <button type="submit" id="btn-girar">Cadastrar e Girar</button>
            </form>
        </section>

        <section class="section-roleta">
            <div class="painel-chances">
                <p>Chances restantes: <strong id="chances-restantes">3</strong></p>
            </div>

            <div class="ponteiro"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </section>
    </main>

    <div id="modal-resultado" class="modal modal-hidden">
        <div class="modal-content">
            <h2>Parabéns!! 🎉🎉 </h2>
            <p id="texto-premio">Você ganhou R$ 50</p>
            <div id="codigo-cupom">CUPOM50</div>
            
            <div class="modal-actions">
                <button id="btn-girar-novamente">Girar Novamente</button>
                <button id="btn-resgatar">Resgatar este Cupom</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <section class="FAQ">
            <h3>Dúvidas Frequentes</h3>
        </section>

        <p>&copy; Direitos reservados 2026 </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
