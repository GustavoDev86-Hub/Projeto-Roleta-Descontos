<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta Avenida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <img src="logo.png" alt="Logo da loja">
    </header>

    <section class="banner">
        <h2>Passo a passo para participar</h2>
        <div class="passos">
            <span>1. Preencha seus dados</span>
            <span>2. Gire a roleta</span>
            <span>3. Resgate ou gire de novo</span>
            <span>4. Use em nossas lojas</span>
        </div>
    </section>

    <!-- Card Principal -->
    <main class="main-roleta">
        <!-- Formulário -->
        <section class="section-form">
            <h1>Sua chance é agora!</h1>
            <p>Cadastre-se e garanta o seu desconto.</p>
            
            <form id="form-lead">
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Aceito os termos e condições</label>
                </div>

                <button type="submit" id="btn-girar">Girar agora</button>
            </form>
        </section>

        <!-- Roleta -->
        <section class="section-roleta">
            <div class="ponteiro"></div>
            <canvas id="wheel" width="350" height="350"></canvas>
        </section>
    </main>

    <!-- Modal de Resultado -->
    <div id="modal-resultado" class="modal modal-hidden">
        <div class="modal-content">
            <h2>Parabéns! 🎉</h2>
            <p id="texto-premio">Você ganhou R$ 50 de desconto!</p>
            <div id="codigo-cupom">CUPOM50</div>
            <div class="modal-acoes">
                <button id="btn-resgatar">Resgatar Cupom</button>
                <button id="btn-girar-novamente">Girar Novamente</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <h3>Dúvidas Frequentes</h3>
        <p>&copy; Direitos reservados 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
